version: '3.8'

services:
  # 🗄️ Production Database
  db:
    image: postgres:15
    container_name: cybershield-db
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: password_change_me
      POSTGRES_DB: cybershield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 🛡️ Sentinel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://sentinel:password_change_me@db:5432/cybershield
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=soc-secret-882
      - JWT_SECRET_KEY=soc-jwt-221
    ports:
      - "5000:5000"

volumes:
  postgres_data:
